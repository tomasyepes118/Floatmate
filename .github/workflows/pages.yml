name: Publicar demo de FloatMate

on:
  push:
    branches: [main]
    paths:
      - '06_Material_adicional/Codigo_y_bases_de_datos/01_Codigo_web/FloatMate_Web/**'
      - '.github/workflows/pages.yml'
      - 'scripts/check-repository.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar el repositorio
        run: node scripts/check-repository.mjs
      - name: Preparar las pantallas y recursos de la demo
        shell: bash
        env:
          WEB_SOURCE: 06_Material_adicional/Codigo_y_bases_de_datos/01_Codigo_web/FloatMate_Web
        run: |
          mkdir -p _site
          cp "$WEB_SOURCE"/*.html _site/
          cp -R "$WEB_SOURCE/assets" _site/assets
          touch _site/.nojekyll
          test -f _site/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Publicar demo
        id: deployment
        uses: actions/deploy-pages@v4
