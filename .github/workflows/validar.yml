name: Validar FloatMate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Compilar Next.js
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  backend:
    name: Probar Laravel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, xml, xmlwriter, curl, fileinfo
          coverage: none
          tools: composer:v2
      - run: composer validate --strict --no-check-publish
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: composer test

  navegador:
    name: Recorrer el segundo avance
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DEMO_E2E: 'true'
      DEMO_DATA_PATH: ${{ runner.temp }}/floatmate-navegador
      FLOATMATE_CAPTURAS: ${{ github.workspace }}/evidencia-avance-2
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, xml, xmlwriter, curl, fileinfo
          coverage: none
          tools: composer:v2
      - name: Preparar Laravel
        working-directory: backend
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          cp .env.example .env
          php artisan key:generate
      - name: Preparar Next.js y Chromium
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium
      - name: Iniciar los servidores de prueba
        run: |
          (cd backend && php artisan serve --host=127.0.0.1 --port=8000 > "$RUNNER_TEMP/laravel.log" 2>&1) &
          (cd frontend && npm run start > "$RUNNER_TEMP/next.log" 2>&1) &
          for intento in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8000/up >/dev/null && curl -fsS http://127.0.0.1:3000/login >/dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/laravel.log" "$RUNNER_TEMP/next.log"
          exit 1
      - name: Verificar consultas y registros
        working-directory: frontend
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencia-avance-2
          path: evidencia-avance-2/
          if-no-files-found: ignore
