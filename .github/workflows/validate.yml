name: Validar FloatMate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar archivos y referencias
        run: node scripts/check-repository.mjs

  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compilar consola
        run: dotnet build "05_Tareas_adicionales/POO_Herencia_y_polimorfismo/FloatMate.POO/FloatMate.Console/FloatMate.Console.csproj" --configuration Release
      - name: Ejecutar demostración
        run: dotnet run --project "05_Tareas_adicionales/POO_Herencia_y_polimorfismo/FloatMate.POO/FloatMate.Console/FloatMate.Console.csproj" --configuration Release --no-build
