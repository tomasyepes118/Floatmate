<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="FloatMate, prototipo para gestionar una flota de buses"
    />
    <title>FloatMate</title>
    <link rel="icon" href="assets/favicon.svg" />
    <link rel="stylesheet" href="assets/vendor/bootstrap.min.css" />
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body data-page="login">
    <main class="login-layout">
      <section class="login-brand">
        <a class="brand" href="index.html"
          ><span class="mark">F</span> FloatMate</a
        >
      </section>
      <section class="login-form-area">
        <form id="login-form" class="login-card">
          <p class="eyebrow">BIENVENIDO A FLOATMATE</p>
          <h2>Iniciar sesión</h2>
          <p class="text-secondary mb-4">Ingresa para consultar tu flota.</p>
          <label for="usuario" class="form-label">Usuario</label
          ><input
            class="form-control mb-3"
            id="usuario"
            name="usuario"
            required
            autocomplete="username"
            placeholder="Tu usuario"
          /><label for="clave" class="form-label">Contraseña</label>
          <div class="input-group mb-4">
            <input
              class="form-control"
              id="clave"
              name="clave"
              type="password"
              required
              autocomplete="current-password"
              placeholder="Tu contraseña"
            /><button
              class="btn btn-outline-secondary"
              type="button"
              id="show-password"
              aria-label="Mostrar contraseña"
            >
              Ver
            </button>
          </div>
          <p id="login-error" class="text-danger" role="alert"></p>
          <button class="btn btn-primary w-100" type="submit">Ingresar</button>
          <div class="demo-access">
            <strong>Acceso de demostración</strong>
            <p>
              Usuario: <code>admin</code> · Contraseña:
              <code>floatmate123</code>
            </p>
            <small>Este prototipo no realiza autenticación real.</small>
          </div>
        </form>
      </section>
    </main>
    <script src="assets/app.js"></script>
  </body>
</html>
